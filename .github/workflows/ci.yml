name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # No version pinned here: it comes from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          # Same major as the production runtime image.
          node-version: 24

      # `postinstall` runs `nuxt prepare`: lint and typecheck need the generated `.nuxt/`.
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Every check runs even when another fails, none of them when the install failed.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      # The build prerenders ~300 pages: it catches server-render errors no test sees.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

  backend:
    name: Backend Django
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # No Python version pinned: uv installs the one `requires-python` asks for.
          working-directory: backend

      - name: Install
        id: install
        run: uv sync --frozen --directory backend

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --directory backend ruff check .

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --directory backend ruff format --check .

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --directory backend pytest -q

      # A model changed without its migration passes the tests and breaks the deploy.
      - name: Migrations à jour
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DJANGO_DEBUG: '1'
        run: uv run --directory backend python manage.py makemigrations --check --dry-run

      - name: Réglages de production
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DJANGO_SECRET_KEY: ci-seulement-jamais-deploye-mais-assez-longue-pour-le-check
          DJANGO_ALLOWED_HOSTS: trainquillou.fr
        run: uv run --directory backend python manage.py check --deploy --fail-level WARNING
